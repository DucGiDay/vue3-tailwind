<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <!-- <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet" /> -->
    <title>Vue 3 Starter</title>

    <!-- [DEBUG] Bắt lỗi sớm nhất - hiện trực tiếp trên màn hình -->
    <script>
      window.__ERRORS = [];
      window.onerror = function (msg, src, line, col, err) {
        var info = msg + ' | ' + src + ':' + line + ':' + col;
        window.__ERRORS.push(info);
        var el = document.getElementById('__debug_errors');
        if (!el) {
          el = document.createElement('div');
          el.id = '__debug_errors';
          el.style.cssText =
            'position:fixed;bottom:0;left:0;right:0;max-height:50vh;overflow:auto;background:#1a1a2e;color:#e94560;font:12px/1.6 monospace;padding:12px;z-index:999999;white-space:pre-wrap;';
          document.body.appendChild(el);
        }
        el.textContent = window.__ERRORS.join('\n');
      };
      window.addEventListener('unhandledrejection', function (e) {
        var msg = '[Promise] ' + (e.reason && (e.reason.stack || e.reason.message || e.reason));
        window.__ERRORS.push(msg);
        var el = document.getElementById('__debug_errors');
        if (el) el.textContent = window.__ERRORS.join('\n');
      });
    </script>

    <!-- Mở devtool trên mobile -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      eruda.init();
    </script>
  </head>
  <body>
    <div id="sub-app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
